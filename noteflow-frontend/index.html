<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoteFlow</title>
    <script>
      // Runs before React mounts so the correct background (black or white)
      // is set on first paint - no flash of the wrong theme on reload.
      (function () {
        var stored = localStorage.getItem('noteflow_theme');
        if (stored === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
